
apiVersion: v1
kind: ConfigMap
metadata:
  name: welcome-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Welcome to KGiSL Institute of Technology</title>
      <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: linear-gradient(135deg, #e0f2fe, #f5e8ff);
          color: #243047;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        .card {
          background: white;
          max-width: 700px;
          margin: 24px;
          padding: 40px;
          border-radius: 20px;
          box-shadow: 0 10px 35px #24304720;
        }
        h1 { color: #4338ca; }
        h2 { color: #0f766e; }
        p { font-size: 18px; line-height: 1.8; }
        .footer { color: #64748b; font-size: 14px; }
      </style>
    </head>
    <body>
      <main class="card">
        <h1>Welcome to KGiSL Institute of Technology!</h1>
        <h2>Hello, I'm Sudharsana</h2>
        <p>
          I am pursuing B.Tech in Computer Science and Business Systems (CSBS).
        </p>
        <p>
          A warm welcome to everyone visiting this page! It is a pleasure to
          connect with you in a space where learning, innovation, creativity,
          and technology come together. Let us explore new ideas, share
          knowledge, support one another, and build a brighter future through
          collaboration and continuous learning. Thank you for visiting, and
          I hope you have a wonderful and inspiring experience!
        </p>
        <p class="footer">
          Learning today, innovating for tomorrow.
        </p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: welcome-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: welcome-content
          configMap:
            name: welcome-page
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
