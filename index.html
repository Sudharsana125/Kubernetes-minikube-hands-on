


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudharsana | My Space</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #070914;
  --text: #f6f7ff;
  --muted: #a6aecb;
  --cyan: #69f5ff;
  --purple: #9d7bff;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 48%, #172448 0%, #0b1024 36%, var(--bg) 75%);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: radial-gradient(#aabfff 0.7px, transparent .7px);
  background-size: 30px 30px;
  mask-image: linear-gradient(to bottom, black, transparent 95%);
}

nav {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1250px;
  margin: auto;
  padding: 28px 6%;
}

.brand {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #dfe7ff;
}

.brand span { color: var(--cyan); }

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #a9b4d4;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.status i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

main {
  min-height: calc(100vh - 100px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 22px 45px;
  position: relative;
  isolation: isolate;
}

h1 {
  position: relative;
  z-index: 3;
  margin: 4px 0 0;
  font-size: clamp(42px, 7vw, 82px);
  line-height: 1.1;
  letter-spacing: -3px;
  font-weight: 750;
  animation: rise 1s ease both;
}

h1 span {
  background: linear-gradient(100deg, #fff 10%, var(--cyan) 48%, #b9a2ff 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.name {
  position: relative;
  z-index: 3;
  margin-top: 17px;
  font-size: clamp(17px, 2.5vw, 23px);
  color: #d8def6;
  letter-spacing: 3px;
  animation: rise 1.2s ease both;
}

.scene {
  width: min(420px, 92vw);
  height: 330px;
  position: relative;
  display: grid;
  place-items: center;
  perspective: 900px;
  margin: -2px 0 -5px;
}

.halo {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, #5142bd35 0%, #1b86c02a 42%, transparent 70%);
  filter: blur(9px);
  animation: pulse 4s ease-in-out infinite;
}

.ring {
  position: absolute;
  width: 270px;
  height: 90px;
  border: 1px solid #69f5ff62;
  border-radius: 50%;
  transform: rotate(-18deg);
  box-shadow: 0 0 22px #59caff16, inset 0 0 18px #59caff12;
}

.ring.two {
  width: 225px;
  height: 70px;
  transform: rotate(35deg);
  border-color: #a78bfa6a;
}

.robot {
  position: relative;
  width: 170px;
  height: 210px;
  transform-style: preserve-3d;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 15px 35px #4c7dff30);
}

.antenna {
  position: absolute;
  top: 0;
  left: 82px;
  width: 5px;
  height: 24px;
  border-radius: 5px;
  background: linear-gradient(90deg, #8796d4, white, #6575ad);
}

.antenna::before {
  content: "";
  position: absolute;
  top: -9px;
  left: -4px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan), 0 0 28px #69f5ffab;
}

.head {
  position: absolute;
  width: 145px;
  height: 110px;
  top: 23px;
  left: 12px;
  border-radius: 43px 43px 35px 35px;
  background: linear-gradient(145deg, #f5f8ff 0%, #a9bde4 27%, #536c9e 56%, #d9e7ff 78%, #7385b9 100%);
  box-shadow:
    inset 5px 5px 12px #fff9,
    inset -8px -10px 17px #283e713b,
    0 0 25px #6b89ff22;
  border: 1px solid #d8e9ffb0;
  transform: translateZ(20px);
}

.face {
  position: absolute;
  inset: 13px 11px 17px;
  border-radius: 31px;
  background: linear-gradient(140deg, #151d39, #080c1d 75%);
  box-shadow: inset 0 0 16px #627cff32, 0 0 8px #69f5ff18;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
}

.eye {
  width: 18px;
  height: 25px;
  border-radius: 50%;
  background: linear-gradient(180deg, #b8ffff, #48cfff 75%);
  box-shadow: 0 0 10px #69f5ff, 0 0 25px #47bfff99;
  animation: blink 5s infinite;
}

.ear {
  position: absolute;
  top: 52px;
  width: 13px;
  height: 30px;
  border-radius: 7px;
  background: linear-gradient(90deg, #586c9f, #e0edff, #6579ac);
}

.ear.left { left: 0; }
.ear.right { right: 0; }

.neck {
  position: absolute;
  width: 46px;
  height: 23px;
  left: 62px;
  top: 126px;
  background: linear-gradient(90deg, #5b6c9d, #e4edff, #7588b7);
  border-radius: 5px;
}

.body-robot {
  position: absolute;
  top: 144px;
  left: 30px;
  width: 110px;
  height: 65px;
  border-radius: 30px 30px 23px 23px;
  border: 1px solid #e6f0ffb0;
  background: linear-gradient(135deg, #e6efff, #8298c8 35%, #3c527f 70%, #cbdcff);
  box-shadow: inset 4px 4px 10px #ffffff9c, inset -5px -5px 10px #24385e4c;
}

.core {
  position: absolute;
  width: 31px;
  height: 25px;
  left: 39px;
  top: 18px;
  border: 1px solid #a1ffff;
  border-radius: 8px;
  background: linear-gradient(135deg, #81ffff, #4483f4);
  box-shadow: 0 0 15px #69f5ff9c, inset 0 0 8px white;
}

.shadow {
  position: absolute;
  bottom: 13px;
  width: 180px;
  height: 24px;
  border-radius: 50%;
  background: #637dff2c;
  filter: blur(12px);
}

.description {
  position: relative;
  z-index: 3;
  max-width: 610px;
  margin: 22px auto 0;
  color: var(--muted);
  font-size: clamp(14px, 1.7vw, 17px);
  line-height: 1.9;
  animation: rise 1.4s ease both;
}

.description strong {
  color: #e5eaff;
  font-weight: 600;
}

.bottom-line {
  width: 75px;
  height: 2px;
  border-radius: 5px;
  margin: 28px auto 0;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
  box-shadow: 0 0 15px #69f5ff70;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotateY(-7deg) rotateX(3deg); }
  50% { transform: translateY(-12px) rotateY(7deg) rotateX(-2deg); }
}

@keyframes pulse {
  0%, 100% { opacity: .55; transform: scale(.94); }
  50% { opacity: 1; transform: scale(1.08); }
}

@keyframes blink {
  0%, 45%, 48%, 100% { transform: scaleY(1); }
  46%, 47% { transform: scaleY(.1); }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  nav { padding: 23px 20px; }
  .brand { font-size: 12px; letter-spacing: 2px; }
  .status { font-size: 9px; letter-spacing: 1px; }
  .scene { height: 290px; transform: scale(.9); margin: -4px 0; }
  h1 { letter-spacing: -1.5px; }
  .description { max-width: 360px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<nav>
  <div class="brand">SUDHARSANA<span>.</span></div>
  <div class="status"><i></i> MY DIGITAL SPACE</div>
</nav>

<main>
  <h1>Welcome to<br><span>My Space</span></h1>
  <div class="name">I'M SUDHARSANA</div>

  <div class="scene" aria-label="Animated futuristic AI robot">
    <div class="halo"></div>
    <div class="ring"></div>
    <div class="ring two"></div>
    <div class="shadow"></div>
    <div class="robot">
      <div class="antenna"></div>
      <div class="head">
        <div class="face">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
      </div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="neck"></div>
      <div class="body-robot">
        <div class="core"></div>
      </div>
    </div>
  </div>

  <p class="description">
    I created this application myself to explore how
    <strong>Docker, Minikube, and Kubernetes</strong> work together
    to deploy, manage, and run a containerized application.
  </p>
  <div class="bottom-line"></div>
</main>
</body>
</html>
